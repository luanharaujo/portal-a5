# Portal worker: serves the pages (Static Assets) and the API from the same origin,
# so the session can live in an HttpOnly cookie.
name = "portal-a5"
main = "src/index.ts"
compatibility_date = "2026-10-01"
workers_dev = true
preview_urls = false

[assets]
directory = "./public"
binding = "ASSETS"
# Paths that are not files (/api/*, /robo/*, /<tab>/*) fall through to the worker.
not_found_handling = "none"

[vars]
# Tabs and their policy, e.g. {"notes":{"binding":"TAB_NOTES","label":"Notes","icon":"grid"}}.
# Left empty here: scripts/deploy.sh fills it, and the [[services]] bindings, from .tabs.local.json
# (git-ignored; format in tabs.example.json). The worker validates it (src/tabs.ts, parseTabs).
TABS = "{}"
# Screen pairing whose request came from another IP than the approving phone: "refuse"
# (screens are paired on the same network as the phone) or "warn" (red warning only).
PAIR_OTHER_IP = "refuse"

[[d1_databases]]
binding = "DB"
database_name = "portal_a5"
# Placeholder. scripts/deploy.sh looks up the real id by name and never commits it.
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

# Tabs are private workers (workers_dev = false, preview_urls = false, no route) that export a
# WorkerEntrypoint with handle(request, identity); their default fetch answers 404. Their
# [[services]] bindings are added at deploy time from .tabs.local.json.

# Secrets (never in this file):
#   ROBOT_LOGIN_KEY  "pa5_robo_" + 32 random bytes; shared with the WhatsApp reader,
#                     accepted only on POST /robo/login (header X-A5-Robot-Key)
#   OWNER_PHONE       the owner's number: target of the wa.me link and the first admin
# Local: .dev.vars (git-ignored). Remote: scripts/deploy.sh pipes them from the Keychain.
